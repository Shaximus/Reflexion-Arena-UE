[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
; PORT COLLISION FIX (2026-08-02).
;
; The UE 5.8 ModelContextProtocol plugin defaults to port 8000 with url path
; "/mcp" (ModelContextProtocol.h: DefaultServerPort = 8000,
; DefaultServerUrlPath = "/mcp"). That is byte-identical to this machine's
; LiteLLM local-inference gateway, which serves its OWN MCP hub at
; 127.0.0.1:8000/mcp.
;
; The collision is silent and actively misleading: `claude mcp list` reports
; "unreal-mcp ... Connected" because SOMETHING answers on 8000/mcp -- but the
; initialize handshake returns serverInfo.name = "litellm-mcp-server". A session
; launched expecting Unreal editor tools would transparently get LiteLLM's
; toolset instead. A green health check is not proof of the right server.
;
; Moved to 8765, outside the local-inference range (gateways 8000-8008,
; backends 8010-8013). Keep .mcp.json in the project root in sync with this.
ServerPortNumber=8765
ServerUrlPath=/mcp
bAutoStartServer=True
bEnableToolSearch=True
