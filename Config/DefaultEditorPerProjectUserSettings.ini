; Reflexion Arena — editor-side per-project settings.

[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
; PORT COLLISION FIX (2026-08-02).
;
; The UE 5.8 ModelContextProtocol plugin defaults to port 8000 with url path
; "/mcp" (ModelContextProtocol.h: DefaultServerPort = 8000,
; DefaultServerUrlPath = "/mcp"). That is byte-identical to this machine's
; LiteLLM local-inference gateway, which serves its OWN MCP hub at
; 127.0.0.1:8000/mcp.
;
; The collision is silent and actively misleading: `claude mcp list` reports
; "unreal-mcp ... Connected" because SOMETHING answers on 8000/mcp -- but the
; initialize handshake returns serverInfo.name = "litellm-mcp-server". A session
; launched expecting Unreal editor tools would transparently get LiteLLM's
; toolset instead. A green health check is not proof of the right server.
;
; Moved to 8765, outside the local-inference range (gateways 8000-8008,
; backends 8010-8013). Keep .mcp.json in the project root in sync with this.
;
; SECOND COLLISION FIX (2026-08-04, ARM-04).
;
; The drift the line above warned about is exactly what happened. Measured state
; before this change:
;   - 8765 was held by an UNRELATED python process (pid 4312), so the plugin
;     could not bind it: "LogHttpListener: Error: HttpListener unable to bind to
;     127.0.0.1:8765" on every editor start.
;   - .mcp.json in the project root had already been moved to 8766, but THIS
;     file was not updated to match. Client and server were pointed at
;     different ports, so unreal-mcp could never connect.
; Two independent faults, and neither one alone explains the outage.
;
; Fixed by moving the server to 8766 -- the port the client config already
; expects -- rather than editing .mcp.json (project root, outside ARM-04 scope)
; and WITHOUT touching pid 4312, which owns 8765 and belongs to something else.
; Verified free before the change: `ss -ltnp 'sport = :8766'` returned nothing.
;
; If this collides again, check with ss BEFORE picking a number. A port that is
; merely absent from this file is not evidence that it is free.
ServerPortNumber=8766
ServerUrlPath=/mcp
bAutoStartServer=True
bEnableToolSearch=True
