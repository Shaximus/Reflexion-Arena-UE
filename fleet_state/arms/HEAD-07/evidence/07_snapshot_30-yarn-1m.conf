# Drop-in: extend Qwen3.5-27B from its native 262,144 to 1,048,576 tokens via YaRN.
#
# Verify this file before applying:
#   /home/shax/Projects/pentarchy/local-inference/vllm-stock-venv/bin/python \
#       preflight_yarn_1m.py        # CPU only, no root, exits non-zero if unsafe
#
# ===========================================================================
# 1. FILENAME IS LOAD-BEARING. This file MUST sort AFTER 20-mem-87.conf.
# ===========================================================================
# An earlier revision was named 10-yarn-1m.conf and was a silent NO-OP.
# systemd applies drop-ins in lexicographic filename order, and
# /etc/systemd/system/qwen27-mtp.service.d/20-mem-87.conf begins with a bare
# `ExecStart=` reset -- MEASURED by reading that file directly. Sorting 10-
# before 20- meant mem-87 wiped this one and re-installed --max-model-len
# 262144. Hence 30-. Preflight gate P1 enforces this and FAILS on a 10- name.
#
# ===========================================================================
# 2. A .pth WRAPPER REWRITES THIS COMMAND LINE BEFORE vLLM SEES IT
# ===========================================================================
# This is the single most important thing to know about this unit, and it was
# missing from every prior version of this file.
#
#   site-packages/qwen_mtp_boot_tuning.pth
#     -> deploy/python_startup/qwen_mtp_boot_tuning.py
#
# A .pth file executes at interpreter startup, BEFORE `-m vllm...` runs. It
# matches this exact invocation on (module, --model, --port,
# --served-model-name) -- all four of which this drop-in still satisfies -- and
# then rewrites sys.argv. MEASURED from /var/log/qwen27-mtp.log, every boot:
#
#   [qwen-mtp-boot-tuning] native MTP K=5 -> K=5   (was K=6 before 23:46 today)
#   [qwen-mtp-boot-tuning] max-num-seqs 5 -> 4     (protects known fatal MTP batch-5 path)
#   [qwen-mtp-boot-tuning] target+MTP attention FLASHINFER -> TRITON_ATTN
#   [qwen-mtp-boot-tuning] disabled CPU KV offload
#   [qwen-mtp-boot-tuning] disabled experimental Mamba align prefix cache
#   [qwen-mtp-boot-tuning] online quantization BF16 -> fp8_per_channel
#
# CONSEQUENCE FOR THIS CHANGE: the wrapper does NOT touch --max-model-len or
# --hf-overrides. The 1M YaRN change survives it intact. Preflight gate P2
# proves this by running the wrapper's OWN functions over this file's argv.
#
# CONSEQUENCE FOR THE UNIT AS WRITTEN: --attention-backend FLASHINFER is a lie
# on disk; TRITON_ATTN is what runs. --kv-offloading-* are deleted outright.
# --quantization fp8_per_channel is INJECTED and appears nowhere in this file.
# Left as-is deliberately: correcting them is a separate change with its own
# verification, and matching the current file keeps the diff to two lines.
#
# ===========================================================================
# 3. THE "THREE SILENTLY DROPPED FLAGS" WERE MISDIAGNOSED
# ===========================================================================
# The prior evidence note claimed vLLM silently drops --enable-prefix-caching,
# --mamba-cache-mode align and --kv-offloading-size 64 because this is a hybrid
# attention model. That is WRONG, and it pointed the fix at the wrong system.
#
# MEASURED: the wrapper DELETES --enable-prefix-caching from argv and sets
# --mamba-cache-mode to none (disable_mamba_prefix_cache_for_decode), and
# DELETES both --kv-offloading-* flags (disable_single_stream_kv_offload). It
# logs every one of those removals to stderr. vLLM never sees the flags, so it
# cannot be dropping them. Nothing is silent and nothing is a vLLM defect.
#
# The observed prefix_cache_queries = 0 is real, and the cause is real, but the
# fix is `rm site-packages/qwen_mtp_boot_tuning.pth` (or edit that module) --
# NOT a vLLM bug report. Do not carry the old story forward.
# Still true and still important for 1M: there is NO KV reuse, so every long
# prompt is re-prefilled in full, every time.
#
# ===========================================================================
# 4. WHAT CHANGED FROM THE RUNNING CONFIG
# ===========================================================================
# Three edits against the effective ExecStart from 20-mem-87.conf:
#   1. --max-model-len 262144 -> 1048576
#   2. + --hf-overrides '{"text_config":{"rope_scaling":{...yarn...}}}'
#   3. --max-num-seqs 5 -> 4   (see below; this is a SAFETY correction)
#
# NOT changed: --gpu-memory-utilization stays 0.87. An earlier revision raised
# it to 0.94; that was wrong (item 6).
#
# CORRECTION -- --max-num-seqs is 4, not 5 and not 1.
#   The running server has ALWAYS had an effective max_num_seqs of 4: the unit
#   says 5 and the wrapper caps it, calling 5 a "known fatal MTP batch-5 path".
#   MEASURED in the boot log's non-default args: 'max_num_seqs': 4.
#   Writing 4 here is behaviour-preserving and removes a fragile dependency --
#   if the .pth wrapper is ever removed, a file saying 5 would boot the engine
#   straight into the path the wrapper exists to prevent.
#   The earlier revision's --max-num-seqs 1 was wrong for a different reason:
#   vLLM v1 allocates KV blocks ON DEMAND (KVCacheManager.allocate_slots,
#   v1/core/kv_cache_manager.py), not max_model_len per sequence, so an 8k
#   request costs ~5 blocks and not 649. Preemption is a designed recompute
#   path in the v1 scheduler, not a hang. Setting 1 would serialize the whole
#   server for a worst case that needs every in-flight request to be full-length.
#
# ===========================================================================
# 5. WHY THE OVERRIDE WORKS ON THIS ARCHITECTURE (MEASURED)
# ===========================================================================
# The risk was real: this config has NO `rope_scaling` key. It has
# `text_config.rope_parameters` (transformers-5 naming):
#   {"mrope_interleaved": true, "mrope_section": [11,11,10],
#    "rope_type": "default", "rope_theta": 10000000,
#    "partial_rotary_factor": 0.25}
#
# It works because `rope_scaling` is a PROPERTY aliasing `rope_parameters`,
# with both a getter and a setter (transformers 5.12.1,
# configuration_utils.py). vLLM's _apply_dict_overrides -> _update_nested
# (config/model.py:413-456) therefore finds a live dict and MERGES into it
# rather than replacing it, so mrope_section / mrope_interleaved / rope_theta /
# partial_rotary_factor all survive. Losing mrope_section would have broken
# this model's rotary layout outright.
#
# MEASURED by feeding this file's real argv through vLLM's OWN CLI parser and
# ModelConfig (preflight gate P3):
#   rope_parameters = {"factor": 4.0, "mrope_interleaved": true,
#     "mrope_section": [11,11,10], "original_max_position_embeddings": 262144,
#     "partial_rotary_factor": 0.25, "rope_theta": 10000000,
#     "rope_type": "yarn"}
#   max_model_len = 1048576
# This is the config Qwen's official 27B model card recommends for 1M; the
# --hf-overrides route and Qwen's documented config.json edit converge.
#
# NEGATIVE CONTROL, and it fails as required (gate P4): the same argv with
# --hf-overrides removed is REJECTED --
#   "User-specified max_model_len (1048576) is greater than the derived
#    max_model_len (max_position_embeddings=262144.0)"
# So this flag is doing real work.
#
# The kernel really uses it (gate P5, MEASURED on CPU): get_rope's yarn branch
# builds MRotaryEmbedding(..., scaling_factor=4.0); inv_freq ratio yarn/base
# runs 1.0 at high frequency -> exactly 0.25 at low, and mscale = 1.138629.
# Negative control: base built twice is byte-identical.
#
# ===========================================================================
# 6. DOES IT FIT? YES -- AND THE NUMBERS MOVE BETWEEN BOOTS
# ===========================================================================
# Do NOT hardcode KV geometry. It changed today: a concurrently running agent
# edited the boot-tuning wrapper (K=6 -> K=5) at 23:46:30 and restarted the
# service, and the pool changed with it (MEASURED, same log, two boots):
#
#   boot 22:58:59   pool 52.80 GiB   block 1632   concurrency 5.48x
#   boot 23:48:23   pool 51.36 GiB   block 1616   concurrency 5.41x
#
# Preflight gate P6 therefore PARSES the latest boot out of the log and gates
# its model on reproducing that boot's concurrency before projecting.
#
# At the 23:48 boot: one 1,048,576-token request costs 34.96 GiB = 68% of the
# 51.36 GiB pool, leaving ~1.46x concurrency after the rotary cache grows.
# It FITS at 0.87. PROJECTED, gated on the measured 5.41x.
#
# The 32 KB/token figure from the original note is right in form but was
# computed with the wrong layer count and a stale block size: the MTP draft
# layer is a 17th full-attention layer (MEASURED: "Add 3 padding layers" on 48
# mamba layers implies group_size 17), and the block size is now 1616.
#
# CORRECTION -- --gpu-memory-utilization stays 0.87.
#   1M already fits with ~46% headroom. Raising it to 0.94 buys ~0.2x
#   concurrency -- still short of two full-length sequences -- while consuming
#   ~6.7 GiB of headroom on a card already holding a 28 GiB fp8 model.
#   kv_cache_size_tokens (1,419,343) is NOT a token pool; vLLM's own comment at
#   v1/core/kv_cache_utils.py:2138 reads
#     "# GPU KV cache size in tokens = max_concurrency * max_model_len"
#   i.e. 5.41 x 262,144. The POOL is 51.36 GiB. The earlier revision's "1M is
#   73% of the EXISTING pool" reached a nearly-right conclusion from a wrong
#   premise.
#
# ===========================================================================
# 7. KNOWN COSTS -- accept them knowingly
# ===========================================================================
# a. STATIC YaRN TAXES SHORT PROMPTS. vLLM's scaling factor is constant
#    regardless of input length. Qwen documents this and publishes NO number:
#      "All the notable open-source frameworks implement static YaRN ...
#       potentially impacting performance on shorter texts. We advise modifying
#       the rope_parameters configuration only when processing long contexts is
#       required."
#    Nearest published quantification is the YaRN paper (arXiv:2309.00071)
#    Table 3 -- Llama 2, fine-tuned, at s=16/32 vs our s=4.0. Treat as an upper
#    bound on magnitude, NOT a transfer. MMLU was the most-affected axis there
#    (-7.0% relative on 13B at s=32).
#    PROJECTED materially smaller at s=4.0, but no primary source measures it
#    for Qwen3.5. IT MUST BE MEASURED LOCALLY -- verify_yarn_1m.py gate V11
#    does this against a pre-change baseline. Record that baseline BEFORE
#    applying or the regression is undetectable.
#
# b. The rotary cos/sin cache grows 128 MiB -> 512 MiB (+384 MiB), MEASURED at
#    bfloat16. MRotaryEmbedding sets cache length = original_max x 4, then YaRN
#    multiplies by scaling_factor again -> 4,194,304 positions for a 1,048,576
#    need. It comes out of the non-KV budget. (An earlier note said +768 MiB;
#    that is the fp32 figure and the server runs --dtype bfloat16.)
#
# c. NOT bit-exact reference YaRN. vLLM passes the ENLARGED cache length to
#    yarn_find_correction_range, giving a different correction band than the
#    reference implementation. This affects Qwen's documented config.json route
#    identically, so it is not a reason to prefer one route -- but vLLM's
#    MRoPE+YaRN is not the reference algorithm.
#
# d. NO PREFIX CACHING (item 3). Every long prompt is re-prefilled in full.
#    MEASURED prefill rate 1,980 tok/s at a 200k-token prompt, so a 1M prompt
#    costs >= 8.8 min of prefill and realistically more (attention cost grows
#    superlinearly). Budget for it.
#
# Rollback:  sudo rm /etc/systemd/system/qwen27-mtp.service.d/30-yarn-1m.conf
#            sudo systemctl daemon-reload && sudo systemctl restart qwen27-mtp

[Service]
ExecStart=
ExecStart=/home/shax/Projects/pentarchy/local-inference/vllm-stock-venv/bin/python -m vllm.entrypoints.openai.api_server --model /home/shax/mnt_data/models/Qwen/Qwen3.5-27B --port 8010 --host 127.0.0.1 --dtype bfloat16 --max-model-len 1048576 --hf-overrides '{"text_config":{"rope_scaling":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":262144}}}' --served-model-name qwen27-mtp --trust-remote-code --gpu-memory-utilization 0.87 --tensor-parallel-size 1 --max-num-seqs 4 --max-num-batched-tokens 8192 --attention-backend FLASHINFER --enable-prefix-caching --enable-chunked-prefill --kv-cache-dtype fp8 --kv-offloading-backend native --kv-offloading-size 64 --generation-config vllm --mamba-cache-mode align --language-model-only --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3 --compilation-config '{"cudagraph_mode": "FULL_AND_PIECEWISE"}' --speculative-config '{"method":"mtp","num_speculative_tokens":5}'
